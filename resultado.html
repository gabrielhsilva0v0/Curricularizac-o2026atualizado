<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Resultado</title>

  <!-- Fonte fofinha -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <h1 class="titulo">🎉 Vitória! 🎉</h1>
    <p>Parabéns! Você completou o desafio!</p>

    <button class="btn">Jogar Novamente</button>
  </div>

  <script>
    for (let i = 0; i < 50; i++) {
      let confete = document.createElement("div");
      confete.classList.add("confete");

      confete.style.left = Math.random() * 100 + "vw";
      confete.style.background = `hsl(${Math.random() * 360}, 100%, 60%)`;
      confete.style.animationDuration = (Math.random() * 3 + 2) + "s";

      document.body.appendChild(confete);
    }
  </script>

</body>
</html>

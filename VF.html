<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styleVF.css">
    <link rel="shortcut icon" href="assets/marrecoPR.png" type="image/x-icon">
    <title>Document</title>
    <script src="Script.js" defer></script>
</head>

<body>
    <audio id="audio">
        <source id="audioSrc" src="assets/audiosVF/fenarreco.mp3" type="audio/mpeg">
    </audio>
    <img class="background" src="assets/tela-de-fundo.jpg" alt="Plano de Fundo">
    <a href="menuPrincipal.html"><img class="homeBtn" src="assets/home-btn.png" alt="voltar para o inicio"></a>
    <main>
        <div class="" id="animation">
            <div class="pergunta">
                <h1 id="pergunta"></h1>
                <button class="audioBtn">
                    <img src="assets/audio.png" alt="" onclick="playAudio()">
                </button>
            </div>
        </div>
        <form class="caixaResposta" id="VF">
            <button class="verdadeiro" type="submit" name="resposta" value="1"><img src="assets/true.jpg" alt="">
                <p>VERDADEIRO</p>
            </button>
            <button class="falso" type="submit" name="resposta" value="0"><img src="assets/false.jpg" alt="">
                <p>FALSO</p>
            </button>
        </form>
    </main>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>tela de RATO </title>
</head>

<body>
    <div class="container">
        <h1>Tela de Login</h1>
        <form class="loginF"> <!-- tag "required" imposssibilita pular login  -->
            <label for="username">Aluno</label>
            <input type="text" id="username" name="username" >
            <br>
          <label for="idade">Idade</label>
          <input type="number" id="idade" name="idade" >
          <br>
          <label for="escola">Escola</label>
          <input type="text" id="escola" name="escola" >
            <br>
            <button class="login" type="submit">Jogar</button>
        </form>
    </div>
</body>
